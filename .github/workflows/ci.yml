# Runs on every PR and on main. No network: tests marked `live` (visayanelectric.com) are skipped
# by pytest's addopts and run only locally with `pytest -m live`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --cov=outages --cov-report=term

  js:
    name: JS time logic (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The page must ignore the browser's zone: run under two zones far from Manila.
      - run: node --test "tests/js/*.test.mjs"
        env:
          TZ: America/New_York
      - run: node --test "tests/js/*.test.mjs"
        env:
          TZ: Asia/Tokyo
