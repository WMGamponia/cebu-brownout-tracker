[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "outages"
version = "0.1.0"
description = "Cebu Brownout Tracker: VECO scheduled power interruptions as data, alerts and a map."
readme = "ROADMAP.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=1.0",
    "apscheduler>=3.11,<4",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outages = ["migrations/*.sql", "areas/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits visayanelectric.com; run with -m live",
    "llm: calls Ollama or Anthropic; run with -m llm",
    "live_telegram: sends a real Telegram message; run with -m live_telegram",
]
addopts = "-m 'not live and not llm and not live_telegram'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
